version: '3.9'

services:
  web:
    build: .
    container_name: flask_app
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318/v1/traces}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-manage-system}
      # Browser-facing issuer/authorize default to localhost; override via .env.cloudflare
      # (or any other env file) when running behind a tunnel/proxy. Server-side URLs
      # always use Docker DNS since those calls never leave the container network.
      - KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER:-http://localhost:8080/realms/inventory-realm}
      - KEYCLOAK_AUTHORIZE_URL=${KEYCLOAK_AUTHORIZE_URL:-http://localhost:8080/realms/inventory-realm/protocol/openid-connect/auth}
      - KEYCLOAK_LOGOUT_BASE=${KEYCLOAK_LOGOUT_BASE:-http://localhost:8080/realms/inventory-realm/protocol/openid-connect/logout}
      - KEYCLOAK_TOKEN_URL=http://keycloak_auth:8080/realms/inventory-realm/protocol/openid-connect/token
      - KEYCLOAK_USERINFO_URL=http://keycloak_auth:8080/realms/inventory-realm/protocol/openid-connect/userinfo
      - KEYCLOAK_JWKS_URL=http://keycloak_auth:8080/realms/inventory-realm/protocol/openid-connect/certs
      - KEYCLOAK_REALM_URL=http://keycloak_auth:8080/realms/inventory-realm
      - KEYCLOAK_ADMIN_API_URL=http://keycloak_auth:8080/admin
      - KEYCLOAK_ADMIN_TOKEN_URL=http://keycloak_auth:8080/realms/master/protocol/openid-connect/token
      - KEYCLOAK_TOKEN_CLIENT_ID=flask-backend
    depends_on:
      - db
      - alloy
      - keycloak
    volumes:
      - ${CI_PROJECT_DIR:-.}:/app

  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak_auth
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: db
      KC_DB_URL_DATABASE: ${POSTGRES_DB:-inventory_db} 
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      KEYCLOAK_ADMIN: ${KEYCLOAK_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD:-admin}
      KC_HOSTNAME_URL: ${KC_HOSTNAME_URL:-http://localhost:8080}
      KC_HOSTNAME_ADMIN_URL: ${KC_HOSTNAME_ADMIN_URL:-http://localhost:8080}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "true"
      # Left unset locally (Keycloak rejects an empty string here). Only gets a
      # real value when .env.cloudflare is merged in via --env-file.
      KC_PROXY_HEADERS:
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    depends_on:
      - db
    volumes:
      - ${CI_PROJECT_DIR:-.}/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  e2e:
    image: mcr.microsoft.com/playwright/python:v1.60.0-jammy
    network_mode: host
    volumes:
      - ${CI_PROJECT_DIR:-.}:/app
    working_dir: /app
    environment:
      - PYTHONPATH=/app
      - E2E_BASE_URL=http://localhost:5000
      - E2E_ALICE_USER=alice_worker
      - E2E_ALICE_PASSWORD=password123
      - E2E_MANAGER_USER=kratos_boss
      - E2E_MANAGER_PASSWORD=password123
    profiles:
      - e2e
    command: >
      sh -c "pip install -q -r requirements.txt &&
             pytest tests/e2e -m e2e -v --tb=short"

  zap:
    image: zaproxy/zap-stable
    profiles:
      - security
    user: zap
    environment:
      SECURITY_SCAN_TARGET: ${SECURITY_SCAN_TARGET:-http://web:5000}
    command: >
      sh -c "zap-baseline.py
      -t $$SECURITY_SCAN_TARGET
      -r zap-baseline-report.html
      -J zap-baseline-report.json
      -I"
    volumes:
      - ${CI_PROJECT_DIR:-.}/security-reports:/zap/wrk:rw
    depends_on:
      - web

  pip-audit:
    image: python:3.12-slim
    profiles:
      - security
    volumes:
      - ${CI_PROJECT_DIR:-.}:/app
    working_dir: /app
    command: >
      sh -c "pip install -q pip-audit &&
             mkdir -p security-reports &&
             pip-audit -r requirements.txt --format json -o security-reports/pip-audit-report.json || true;
             pip-audit -r requirements.txt --format columns > security-reports/pip-audit-report.txt 2>&1 || true"

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ${CI_PROJECT_DIR:-.}/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${CI_PROJECT_DIR:-.}/observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: postgres_exporter
    env_file:
      - .env
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-inventory_db}?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - db

  tempo:
    image: grafana/tempo:2.7.1
    container_name: tempo
    ports:
      - "3200:3200"
    volumes:
      - ${CI_PROJECT_DIR:-.}/observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    command: ["-config.file=/etc/tempo.yaml"]

  loki:
    image: grafana/loki:3.4.2
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ${CI_PROJECT_DIR:-.}/observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki.yaml

  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ${CI_PROJECT_DIR:-.}/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ${CI_PROJECT_DIR:-.}/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml

  alloy:
    image: grafana/alloy:v1.6.1
    container_name: alloy
    ports:
      - "4317:4317"
      - "4318:4318"
      - "12345:12345"
    volumes:
      - ${CI_PROJECT_DIR:-.}/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - tempo
      - loki
    
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: jenkins_ci
    profiles:
      - jenkins
    restart: unless-stopped
    ports:
      - "8090:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - HOST_PROJECT_DIR=${PWD}
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
    user: root

volumes:
  postgres_data:
  prometheus_data:
  tempo_data:
  loki_data:
  grafana_data:
  alloy_data:
  jenkins_home: