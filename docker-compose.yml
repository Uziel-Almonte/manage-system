version: '3.9'

services:
  web:
    build: .
    container_name: flask_app
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    depends_on:
      - db
    volumes:
      - .:/app

  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak_auth
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: db
      KC_DB_URL_DATABASE: ${POSTGRES_DB:-inventory_db} 
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      KEYCLOAK_ADMIN: ${KEYCLOAK_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD:-admin}
      KC_HOSTNAME_URL: http://localhost:8080
      KC_HOSTNAME_ADMIN_URL: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "true"
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    depends_on:
      - db
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json

  e2e:
    image: mcr.microsoft.com/playwright/python:v1.60.0-jammy
    network_mode: host
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - PYTHONPATH=/app
      - E2E_BASE_URL=http://localhost:5000
      - E2E_ALICE_USER=alice_worker
      - E2E_ALICE_PASSWORD=password123
      - E2E_MANAGER_USER=kratos_boss
      - E2E_MANAGER_PASSWORD=password123
    profiles:
      - e2e
    command: >
      sh -c "pip install -q -r requirements.txt &&
             pytest tests/e2e -m e2e -v --tb=short"

volumes:
  postgres_data: