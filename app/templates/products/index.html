{% extends "base.html" %}

{% block title %}Productos - Sistema de Gestión de Inventario{% endblock %}

{% block content %}
<div class="mb-6 flex justify-between items-center">
    <h2 class="text-2xl font-bold text-gray-800">Gestionar Productos</h2>
    {% if 'product:manage' in session.get('user_scopes', []) %}
    <a href="/products/new" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
        + Nuevo Producto
    </a>
    {% endif %}
</div>

<div class="bg-white rounded-lg shadow-md p-6">
    <div class="mb-4">
        <!-- The HTMX search input -->
        <input class="w-full md:w-1/3 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
               type="search" 
               name="search" 
               placeholder="Buscar por Nombre, SKU o Categoría..." 
               hx-get="/products" 
               hx-trigger="input changed delay:500ms, search" 
               hx-target="#table-container"
               hx-push-url="true"
               value="{{ search }}">
    </div>
    
    <div id="table-container">
        {% include 'products/partials/table.html' %}
    </div>
</div>
{% endblock %}
