name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  PYTHON_VERSION: "3.12"
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ci_password
  POSTGRES_DB: inventory_db
  DATABASE_URL: postgresql://postgres:ci_password@localhost:5432/inventory_db
  FLASK_APP: app.main
  PYTHONPATH: .

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify application imports
        run: python -c "from app.main import app; assert app is not None"

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/test_products.py tests/test_stock.py -v --tb=short

  api-tests:
    name: API / contract tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Schemathesis contract tests
        run: pytest tests/test_contract.py -v --tb=short

  integration-tests:
    name: Integration / data tests
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: inventory_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inventory_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply database migrations
        run: flask db upgrade

      - name: Run data and migration tests
        run: pytest tests/data/ -v --tb=short

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [unit-tests, api-tests, integration-tests]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: inventory_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inventory_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply database migrations
        run: flask db upgrade

      - name: Run tests with coverage (no E2E)
        run: |
          pytest tests/ -m "not e2e" \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [unit-tests, api-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Start CI stack (Postgres, Keycloak, Flask)
        run: docker compose -f docker-compose.ci.yml up -d --build

      - name: Wait for Keycloak
        run: |
          for i in $(seq 1 36); do
            if curl -sf http://localhost:8080/realms/inventory-realm/.well-known/openid-configuration; then
              exit 0
            fi
            sleep 5
          done
          echo "Keycloak did not become ready in time"
          docker compose -f docker-compose.ci.yml logs keycloak
          exit 1

      - name: Wait for Flask
        run: |
          for i in $(seq 1 24); do
            if curl -sf http://localhost:5000/auth/login-page; then
              exit 0
            fi
            sleep 5
          done
          echo "Flask did not become ready in time"
          docker compose -f docker-compose.ci.yml logs web
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies and Playwright
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run E2E tests
        env:
          E2E_BASE_URL: http://localhost:5000
          E2E_ALICE_USER: alice_worker
          E2E_ALICE_PASSWORD: password123
          E2E_MANAGER_USER: kratos_boss
          E2E_MANAGER_PASSWORD: password123
        run: pytest tests/e2e -m e2e -v --tb=short

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs --no-color

      - name: Stop CI stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v || true

  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [unit-tests, api-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build application image
        run: docker build -t manage-system:ci .
