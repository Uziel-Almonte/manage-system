sonar.organization=uziel-almonte
sonar.projectKey=Uziel-Almonte_manage-system
sonar.sources=app
sonar.tests=tests
sonar.exclusions=**/__pycache__/**,tests/e2e/**,migrations/**,keycloak/realm-export.json
# Helper scripts and one-off generators are not application code; keep them out of coverage.
sonar.coverage.exclusions=scripts/**,generate_openapi_spec.py,tests/**,migrations/**
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
