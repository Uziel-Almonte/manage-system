groups:
    #agrupamos las reglas de alerta en un grupo llamado "manage-system"
  - name: manage-system
    rules:
        # (la alerta HighErrorRate vive solo en alerts.rules.yml; tenerla duplicada con otra expresion causaba conflicto)
        #declaramos una alerta llamada TargetDown que se activara cuando un objetivo de Prometheus esté inactivo durante más de 1 minuto.
      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "Prometheus target {{ $labels.job }} is down"
