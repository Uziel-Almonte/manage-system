# Minimal stack for CI / E2E (no observability services).
# CI_PROJECT_DIR must be a host path when compose is driven from Jenkins-in-Docker
# (bind mounts are resolved by the Docker daemon on the host).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: inventory_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Create Keycloak's DB without bind mounts (Jenkins-in-Docker can't mount jenkins_home paths).
  keycloak-db-init:
    image: postgres:16
    environment:
      PGPASSWORD: ci_password
    entrypoint:
      - bash
      - -ec
      - |
        until pg_isready -h db -U postgres -d inventory_db; do sleep 1; done
        if ! psql -h db -U postgres -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='keycloak'" | grep -q 1; then
          psql -h db -U postgres -d postgres -c 'CREATE DATABASE keycloak'
        fi
        psql -h db -U postgres -d keycloak -c 'SELECT 1'
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ci_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_URL: http://localhost:8080
      KC_HOSTNAME_ADMIN_URL: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e \"GET /realms/inventory-realm/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q \"200\"'"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 300s
    depends_on:
      db:
        condition: service_healthy
      keycloak-db-init:
        condition: service_completed_successfully
    volumes:
      - ${CI_PROJECT_DIR:-.}/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  web:
    build:
      context: ${CI_PROJECT_DIR:-.}
    environment:
      PYTHONPATH: /app
      FLASK_APP: app.main
      OTEL_ENABLED: "false"
      FLASK_SECRET_KEY: ci-secret-key
      DATABASE_URL: postgresql://postgres:ci_password@db:5432/inventory_db
      KEYCLOAK_HOST: keycloak
      KEYCLOAK_WAIT_ATTEMPTS: "180"
      KEYCLOAK_WAIT_DELAY: "2"
      KEYCLOAK_REALM_URL: http://localhost:8080/realms/inventory-realm
      KEYCLOAK_CLIENT_ID: flask-backend
      KEYCLOAK_AUTHORIZE_URL: http://localhost:8080/realms/inventory-realm/protocol/openid-connect/auth
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/inventory-realm/protocol/openid-connect/token
      KEYCLOAK_USERINFO_URL: http://keycloak:8080/realms/inventory-realm/protocol/openid-connect/userinfo
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/inventory-realm/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8080/realms/inventory-realm
    ports:
      - "5000:5000"
    command: >
      sh -c "set -eu;
             python scripts/wait-for-keycloak-realm.py;
             flask db upgrade;
             flask --app app.main run --host=0.0.0.0 --port=5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/auth/login-page', timeout=3)\""]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
